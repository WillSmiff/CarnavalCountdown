<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151b">
  <title>Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --background-image: url("background.jpg");
      --ink: #f5f4ef;
      --muted: rgba(249, 248, 245, 0.878);
      --accent: #efd4a0;
    }

    * { box-sizing: border-box; }

    body { 
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: #10151b;
      font-family: "DM Sans", sans-serif;
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      padding: 48px 24px;
    }

    .scene::before,
    .scene::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: "";
    }

    .scene::before {
      background-image: var(--background-image);
      background-position: center;
      background-size: cover;
      animation: arrive 1.4s ease-out both;
    }

    .scene::after {
      background: linear-gradient(180deg, rgba(10, 15, 20, 0.34), rgba(10, 15, 20, 0.58) 55%, rgba(10, 15, 20, 0.78));
    }

    main {
      width: min(100%, 880px);
      text-align: center;
      animation: rise-in 800ms 120ms ease-out both;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.8rem, 8vw, 5.75rem);
      font-weight: 500;
      line-height: 1.08;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 540px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.7;
      text-wrap: balance;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 3vw, 28px);
      margin: clamp(42px, 8vh, 72px) auto 0;
      padding-top: 30px;
      border-top: 1px solid rgba(245, 244, 239, 0.28);
    }

    .unit { min-width: 0; }

    .value {
      display: block;
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 400;
      line-height: 1;
    }

    .label {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .finished {
      margin: 46px 0 0;
      color: var(--accent);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.8rem;
    }

    [hidden] { display: none !important; }

    @keyframes arrive {
      from { transform: scale(1.035); }
      to { transform: scale(1); }
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .scene { padding: 36px 18px; }
      .countdown { padding-top: 24px; }
      .label { font-size: 0.62rem; letter-spacing: 0.1em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <main>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>

      <section class="countdown" id="countdown" aria-label="Time remaining" aria-live="off">
        <div class="unit"><span class="value" id="days">0</span><span class="label">Days</span></div>
        <div class="unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div>
        <div class="unit"><span class="value" id="minutes">00</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="value" id="seconds">00</span><span class="label">Seconds</span></div>
      </section>
      <p class="finished" id="finished" role="status" hidden>The moment is here.</p>
    </main>
  </div>

  <script>
    // Customize these four values for your event.
    const eventTitle = "Carnaval";
    const eventSubtitle = "The best part of the year is almost here.";
    const eventDate = "2026-11-11T00:00:00";
    const eyebrowText = "Save the date";

    document.title = eventTitle;
    document.getElementById("title").textContent = eventTitle;
    document.getElementById("subtitle").textContent = eventSubtitle;
    document.getElementById("eyebrow").textContent = eyebrowText;

    const targetTime = new Date(eventDate).getTime();
    const countdown = document.getElementById("countdown");
    const finished = document.getElementById("finished");
    const units = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    function updateCountdown() {
      const remaining = targetTime - Date.now();
      if (!Number.isFinite(targetTime) || remaining <= 0) {
        countdown.hidden = true;
        finished.hidden = false;
        return;
      }

      const totalSeconds = Math.floor(remaining / 1000);
      units.days.textContent = Math.floor(totalSeconds / 86400);
      units.hours.textContent = String(Math.floor((totalSeconds % 86400) / 3600)).padStart(2, "0");
      units.minutes.textContent = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      units.seconds.textContent = String(totalSeconds % 60).padStart(2, "0");
    }

    updateCountdown();
    window.setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
